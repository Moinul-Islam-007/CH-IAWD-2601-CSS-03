<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Class 03</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="parent">

        <div class="save">
            <span>Save: 1,199৳</span>
        </div>

        <div class="img">
            <img src="nubia.webp" alt="Nubia">
        </div>

        <div class="details">

        <a href="https://www.startech.com.bd/zte-nubia-a36">ZTE nubia A36</a>

        <ul>
            <li>Display: 6.75 inches HD+ 90Hz IPS LCD Display</li>
            <li>Processor: Unisoc T7200 (12 nm)</li>
            <li>Camera: Dual 13 on Rear, 5 MP on Front</li>
            <li>Features: 5000mAh Battery, Type-C Charging</li>
        </ul>

        <div class="price">
            <span class="new">13,300৳</span>
            <span class="old">14,499৳</span>
        </div>

        <div class="button">
            <button><span><i class="fa-solid fa-cart-shopping"></i></span>Buy now</button>
            <button><span><i class="fa-solid fa-clone"></i></span>Add to Compare</button>
        </div>

    </div>

    </div>


    
</body>
</html>
